<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!-- Maskable: content within 80% safe zone, background fills full square -->
  <defs>
    <linearGradient id="msky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffde97"/>
      <stop offset="50%"  stop-color="#ffaf45"/>
      <stop offset="100%" stop-color="#f77f00"/>
    </linearGradient>
    <linearGradient id="mshade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1d3041"/>
      <stop offset="100%" stop-color="#020a15"/>
    </linearGradient>
    <radialGradient id="mglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#ffedb5" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#ffedb5" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffedb5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="100" height="100" fill="url(#msky)"/>
  <rect y="58" width="100" height="42" fill="url(#mshade)"/>
  <circle cx="50" cy="50" r="50" fill="url(#mglow)"/>
  <circle cx="50" cy="50" r="18" fill="#ffedb5"/>
  <g stroke="#ffe9a5" stroke-width="2.5" stroke-linecap="round" opacity="0.92">
    <line x1="37.61" y1="31.36" x2="34.61" y2="26.76"/>
    <line x1="43.60" y1="28.19" x2="42.07" y2="22.88"/>
    <line x1="50"    y1="27"    x2="50"    y2="21"/>
    <line x1="56.40" y1="28.19" x2="57.93" y2="22.88"/>
    <line x1="62.39" y1="31.36" x2="65.39" y2="26.76"/>
  </g>
  <line x1="0" y1="58" x2="100" y2="58" stroke="#06131e" stroke-width="0.7" opacity="0.45"/>
</svg>
